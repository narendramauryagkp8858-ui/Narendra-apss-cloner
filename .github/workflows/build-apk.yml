name: Build Narendra Apps Cloner APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build Narendra Apps Cloner APK
        run: |
          TARGET_DIR="."
          if [ -f "settings.gradle" ]; then
            TARGET_DIR="."
          elif [ -f "android/settings.gradle" ]; then
            TARGET_DIR="android"
          else
            FOUND=$(find . -name "settings.gradle" -not -path "*/.*" | head -n 1)
            if [ -n "$FOUND" ]; then
              TARGET_DIR=$(dirname "$FOUND")
            fi
          fi

          echo "Building Android project in: $TARGET_DIR"
          cd "$TARGET_DIR"

          if [ ! -f "gradle.properties" ]; then
            printf "android.useAndroidX=true\nandroid.enableJetifier=true\n" > gradle.properties
          fi

          gradle assembleDebug -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true --console=plain --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NarendraAppsCloner-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/app/build/outputs/apk/**/*.apk
          retention-days: 30
