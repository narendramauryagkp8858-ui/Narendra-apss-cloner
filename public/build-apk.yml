name: Build Narendra App Cloner APK (GitHub Actions)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Official Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Locate Android Project & Build APK
        run: |
          TARGET_DIR="."
          if [ -f "settings.gradle" ]; then
            TARGET_DIR="."
          elif [ -f "android/settings.gradle" ]; then
            TARGET_DIR="android"
          else
            FOUND=$(find . -name "settings.gradle" -not -path "*/.*" | head -n 1)
            if [ -n "$FOUND" ]; then
              TARGET_DIR=$(dirname "$FOUND")
            fi
          fi

          echo "=========================================="
          echo "Building Android project in: $TARGET_DIR"
          echo "=========================================="
          cd "$TARGET_DIR"

          # Clean up any duplicate .kts files
          rm -f build.gradle.kts settings.gradle.kts app/build.gradle.kts 2>/dev/null || true

          # Ensure AndroidX is enabled even if gradle.properties is missing
          if [ ! -f "gradle.properties" ]; then
            printf "android.useAndroidX=true\nandroid.enableJetifier=true\n" > gradle.properties
          elif ! grep -q "android.useAndroidX" gradle.properties; then
            printf "\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n" >> gradle.properties
          fi

          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

          # Build debug APK with AndroidX flags & clear console output
          gradle assembleDebug -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true --console=plain --no-daemon

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NarendraAppCloner-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/app/build/outputs/apk/**/*.apk
            **/*.apk
          retention-days: 30
